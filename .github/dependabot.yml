version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Månedlig for å spare Actions-minutter. Sikkerhetsoppdateringer kommer
    # uavhengig av dette (automatiske sikkerhetsrettinger er på i repoet).
    schedule:
      interval: monthly
    groups:
      # Better Auth er låst til eksakte versjoner, og pakkene må følge
      # hverandre (peer-avhengigheter), så de oppdateres samlet.
      better-auth:
        patterns: ["better-auth", "@better-auth/*", "better-call"]
      # Next og OpenNext oppgraderes sammen.
      next-og-opennext:
        patterns: ["next", "@opennextjs/cloudflare", "eslint-config-next"]
      minor-og-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    ignore:
      # Typene følger Node-versjonen i CI og løftes sammen med den.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
